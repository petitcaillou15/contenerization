apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: mini-reseau  # On le place dans notre Namespace
spec:
  replicas: 1   # Nombre de conteneurs souhaités
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: mini-reseau-social-users:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Toute la configuration non sensible partagée (ConfigMap)
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            # "postgres" = Service ExternalName qui pointe vers la base hors cluster
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DB)?currentSchema=users"
            - name: SPRING_DATASOURCE_USERNAME
              value: users_svc
            # Données sensibles : une clé à la fois, depuis le Secret
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: USERS_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          # Sondes de santé (Spring Actuator)
          # startup : laisse jusqu'à 300 s (60 x 5 s) à l'application pour démarrer
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          # readiness : le pod ne reçoit du trafic que s'il est prêt
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness : redémarre le conteneur s'il est bloqué
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
