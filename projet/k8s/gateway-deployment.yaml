apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mini-reseau
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: mini-reseau-social-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Sondes de santé (route /healthz de nginx)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
