openapi: 3.1.0
info:
  title: Mini réseau social — service posts
  version: 1.0.0
  description: >
    Fil d'actualité, posts et commentaires.


    Lectures (`GET /posts`, `GET /posts/{id}`) **publiques**. Écritures
    protégées par `Authorization: Bearer <jwt>` : le service valide le token en
    appelant `users` en interne. Si `users` est injoignable, les écritures
    renvoient `503` (`writes temporarily disabled`) mais les lectures continuent.


    La création d'un commentaire publie un événement Redis `comment.created`
    consommé par `notifications` — invisible pour le client.


    Routes décrites **derrière le gateway** : `servers.url` inclut `/api/posts`,
    que le gateway retire. Les chemins `/posts/...` donnent une URL publique à
    segment doublé, ex. `GET /api/posts/posts`.
servers:
  - url: http://{host}/api/posts
    variables:
      host:
        default: localhost:8081
        description: hôte:port du gateway
# Public par défaut ; chaque opération protégée redéclare `security: [bearerAuth]`.
security: []
tags:
  - name: fil
    description: Lecture du fil et des posts (public)
  - name: écriture
    description: Création et suppression (authentifié)
  - name: exploitation
    description: Santé

paths:
  /posts:
    get:
      tags: [fil]
      operationId: feed
      summary: Fil d'actualité paginé
      description: >
        URL publique `GET /api/posts/posts`. Posts triés par date décroissante.
        Public.
      parameters:
        - name: page
          in: query
          required: false
          description: Index de page, base 0. Une valeur < 0 est ramenée à 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: >
            Taille de page. Valeur ≤ 0 ⇒ 20. Valeur > 100 ⇒ ramenée à 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page de posts. `page` et `limit` reflètent les valeurs effectives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
              example:
                items:
                  - id: 2
                    title: Astuce Kubernetes
                    author_id: 2
                    created_at: '2026-09-02T13:50:43.618Z'
                  - id: 1
                    title: Bienvenue
                    author_id: 1
                    created_at: '2026-09-02T13:50:43.610Z'
                page: 0
                limit: 20
                total: 2
    post:
      tags: [écriture]
      operationId: createPost
      summary: Publier un post
      description: >
        URL publique `POST /api/posts/posts`. L'auteur est le porteur du token.
        Renvoie l'identifiant du post créé.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            example:
              title: Mon premier post
              content: Contenu de démonstration.
      responses:
        '201':
          description: Post créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: 3
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/WritesDisabled'

  /posts/{id}:
    get:
      tags: [fil]
      operationId: postDetail
      summary: Détail d'un post et ses commentaires
      description: URL publique `GET /api/posts/posts/{id}`. Public.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Post trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
              example:
                id: 1
                title: Bienvenue
                content: Premier post de démonstration.
                author_id: 1
                created_at: '2026-09-02T13:50:43.610Z'
                comments:
                  - id: 1
                    author_id: 2
                    content: Super, merci !
                    created_at: '2026-09-02T13:51:00.000Z'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [écriture]
      operationId: deletePost
      summary: Supprimer son propre post
      description: >
        URL publique `DELETE /api/posts/posts/{id}`. Seul l'auteur peut
        supprimer. Les commentaires partent en cascade. Pas de corps de réponse.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post supprimé.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Authentifié mais pas l'auteur du post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not the author
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/WritesDisabled'

  /posts/{id}/comments:
    post:
      tags: [écriture]
      operationId: addComment
      summary: Commenter un post
      description: >
        URL publique `POST /api/posts/posts/{id}/comments`. L'auteur est le
        porteur du token. Publie l'événement `comment.created` (Redis) pour
        `notifications`. Renvoie l'identifiant du commentaire.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            example:
              content: Super post !
      responses:
        '201':
          description: Commentaire créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: 5
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/WritesDisabled'

  /health:
    get:
      tags: [exploitation]
      operationId: postsHealth
      summary: Santé du service (Spring Boot Actuator)
      description: >
        Public. URL publique `GET /api/posts/health`. Si `users` est injoignable,
        `status` vaut `DEGRADED` **avec un code HTTP 200** (écritures coupées,
        lectures OK).
      responses:
        '200':
          description: Service en vie (éventuellement dégradé).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
                components:
                  db:
                    status: UP
                  usersDependency:
                    status: UP

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'En-tête `Authorization: Bearer <token>` obtenu via POST /api/users/login.'

  parameters:
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    Unauthorized:
      description: Token absent, invalide ou expiré.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    NotFound:
      description: Post inexistant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: post 42 not found
    ValidationError:
      description: Corps de requête invalide. `error` = premier champ fautif.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: title must not be blank
    WritesDisabled:
      description: >
        Dépendance `users` momentanément injoignable : les écritures sont
        temporairement désactivées. Réessayer plus tard.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: writes temporarily disabled

  schemas:
    CreatePostRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 5000
      additionalProperties: false

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    IdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
      additionalProperties: false

    PostSummary:
      type: object
      required: [id, title, author_id, created_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    CommentView:
      type: object
      required: [id, author_id, content, created_at]
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        content:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PostDetail:
      type: object
      required: [id, title, content, author_id, created_at, comments]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentView'
      additionalProperties: false

    PostPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        page:
          type: integer
          minimum: 0
          description: Page effective (échoie la valeur assainie).
        limit:
          type: integer
          description: Taille de page effective (échoie la valeur assainie).
        total:
          type: integer
          format: int64
          description: Nombre total de posts, toutes pages confondues.
      additionalProperties: false

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN, OUT_OF_SERVICE, UNKNOWN]
        components:
          type: object
          additionalProperties: true
      additionalProperties: true
