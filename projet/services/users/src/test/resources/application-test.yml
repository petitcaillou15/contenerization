      ddl-auto: none
    properties:
      hibernate:
        default_schema: PUBLIC
  liquibase:
    default-schema: PUBLIC
    contexts: demo          # les tests chargent le seed pour avoir des données

jwt:
  secret: test-secret-test-secret-test-secret-0123456789
  expiration-seconds: 3600
