spring:
  datasource:
    url: jdbc:h2:mem:posts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: PUBLIC
  liquibase:
    default-schema: PUBLIC
    contexts: demo
  data:
    redis:
      host: localhost
      port: 6379          # non contacté dans les tests unitaires (publisher mocké)

posts:
  max-content-length: 280

users:
  service-url: http://users.test.invalid    # jamais appelé réellement en test unitaire
  http-timeout-ms: 200
