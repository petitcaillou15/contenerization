spring:
  datasource:
    url: jdbc:h2:mem:notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: PUBLIC
  liquibase:
    default-schema: PUBLIC
    contexts: demo
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    # Le listener Redis n'est pas nécessaire pour les tests de contexte/web ;
    # on neutralise l'auto-config Redis pour éviter une connexion réelle.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

users:
  service-url: http://users.test.invalid
  http-timeout-ms: 200
